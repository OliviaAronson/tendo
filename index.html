</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="icon.svg" alt="">tendo</div><nav id="side-nav" class="nav"></nav></aside><main><header><div><div class="mobile-title"><img class="logo-sm" src="icon.svg" alt=""> <strong>tendo</strong></div><h1 id="heading">Your week</h1><div class="sub">Climbing · strength · recovery</div></div><button id="quick" class="primary">+ Log</button></header><div id="app"></div></main></div><nav id="bottom-nav" class="bottom"></nav><script>
(()=>{'use strict';
const KEY='tendo_v1', names=['Outdoor climbing','Indoor climbing','Glute strength','Pull / lock-offs','Push / antagonist','Mobility','Injury Rehab & Prevention'], nav=['Home','Plan','Running','Journal','Progress','Settings'];
const iso=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const initial=()=>({version:1,start:iso(),block:'Training block',targets:names.map((name,i)=>({id:uid(),name,weeks:Array.from({length:5},()=>({min:[1,0,1,1,1,2,2][i],more:[3,5,2,2,2,3,4][i],bonus:[5,7,3,3,3,4,5][i]}))})),sessions:[],logs:{},symptoms:[],records:[],templates:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.sessions)||!Array.isArray(db.targets))db=initial();
db.logs??={};db.symptoms??=[];db.records??=[];db.templates??=[];db.targets=db.targets.filter(t=>t.name!=='Conditioning');db.targets.forEach(t=>{if(t.name==='Rehab'||t.name==='Recovery')t.name='Injury Rehab & Prevention';if(!Array.isArray(t.weeks))t.weeks=Array.from({length:5},()=>({min:1,more:2,bonus:3}))});db.sessions.forEach(s=>{if(s.category==='Rehab'||s.category==='Recovery')s.category='Injury Rehab & Prevention'});
let page='Home',week=0,date=iso(),edit=null;const $=id=>document.getElementById(id),persist=()=>{try{const raw=JSON.stringify(db);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('Readback mismatch');return true}catch(e){alert('Saving failed. Your changes may not be stored. Please export a backup.');return false}},count=(name,w)=>db.sessions.filter(s=>s.category===name&&weekOf(s.date)===w).length;
function weekOf(d){return Math.floor((new Date(d+'T12:00:00')-new Date(db.start+'T12:00:00'))/604800000)}
function options(v,zero=false){return '<option value="">—</option>'+Array.from({length:zero?11:10},(_,i)=>{let n=i+(zero?0:1);return '<option '+(String(v)===String(n)?'selected':'')+'>'+n+'</option>'}).join('')}
const field=(name,label,value='',type='text')=>'<div class="field"><label>'+safe(label)+'</label><input name="'+name+'" type="'+type+'" value="'+safe(value)+'"></div>';
function navRender(){for(const id of ['side-nav','bottom-nav'])$(id).innerHTML=nav.map(n=>'<button data-page="'+n+'" class="'+(n===page?'active':'')+'">'+n+'</button>').join('')}
function render(){navRender();$('heading').textContent=({Home:'Your week',Plan:'Five-week plan',Running:'Half-marathon training',Journal:'Daily journal',Progress:'Progress',Settings:'Settings'})[page];$('app').innerHTML=({Home:home,Plan:plan,Running:running,Journal:journal,Progress:progress,Settings:settings})[page]();bind()}
function tabs(){return '<div class="tabs">'+Array.from({length:5},(_,i)=>'<button data-week="'+i+'" class="'+(week===i?'active':'')+'">Week '+(i+1)+'</button>').join('')+'</div>'}
function home(){let w=Math.min(4,Math.max(0,weekOf(iso()))),recent=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return '<div class="grid"><section class="card"><div class="row"><h2>Week '+(w+1)+' at a glance</h2><button class="soft small" data-page="Plan">Plan</button></div>'+db.targets.map(t=>'<div class="stat"><span>'+safe(t.name)+'</span><strong>'+count(t.name,w)+' / '+t.weeks[w].min+'</strong></div>').join('')+'</section><section class="card"><div class="row"><h2>Recent sessions</h2><button class="soft small" data-page="Journal">Journal</button></div>'+(recent.length?recent.map(s=>'<div class="entry"><strong>'+safe(s.category)+'</strong><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+'</p></div>').join(''):'<p class="muted">No sessions logged yet.</p>')+'</section></div><div class="notice">Your entries are saved in this browser on this device. Export a backup regularly; they do not automatically sync between your Mac and iPhone.</div>'}
function plan(){return '<section class="card"><div class="row wrap"><h2>'+safe(db.block)+'</h2><button class="soft small" id="change-block">Edit block</button></div><div class="sub">Starts '+safe(db.start)+' · tap a count to log a session</div><div class="tablewrap"><table><thead><tr><th>Training</th>'+Array.from({length:5},(_,i)=>'<th>W'+(i+1)+'</th>').join('')+'</tr></thead><tbody>'+db.targets.map(t=>'<tr><td>'+safe(t.name)+'</td>'+t.weeks.map((g,i)=>'<td><button class="soft small '+(count(t.name,i)>=g.min&&g.min?'met':'')+'" data-logcat="'+safe(t.name)+'" data-logweek="'+i+'">'+count(t.name,i)+'/'+g.min+'</button></td>').join('')+'</tr>').join('')+'</tbody></table></div></section><section class="card"><h2>Weekly targets</h2>'+tabs()+'<p class="sub">Minimum / More / Bonus sessions</p>'+db.targets.map((t,i)=>'<div class="entry"><strong>'+safe(t.name)+'</strong><div class="formgrid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px">'+['min','more','bonus'].map(k=>'<div class="field"><label>'+k+'</label><input type="number" min="0" max="30" data-target="'+i+'" data-kind="'+k+'" value="'+t.weeks[week][k]+'"></div>').join('')+'</div></div>').join('')+'<button class="soft section" id="add-category">+ Category</button></section>'}
const EXERCISE_BANK={
'Glutes & legs':['Romanian deadlift','Bulgarian split squat','Hip thrust','Glute bridge','Step-up','Cable kickback','Hip abduction','Curtsy lunge','Single-leg Romanian deadlift','Leg press'],
'Pull & climbing':['Weighted pull-up','Pronated lock-off','Assisted one-arm lock-off','Scapular pull-up','Lat pulldown','Chest-supported row','Hammer curl','Seated cable row'],
'Push & antagonist':['Dips','Incline chest press','Push-up','Overhead press','Lateral raise','Triceps extension','Reverse wrist curl'],
'Core':['Ab wheel rollout','Hanging leg raise','Dead bug','Side plank'],
'Fingers & forearms':['Hangboard hold','Finger extensor exercise','Wrist pronation/supination'],
'Knee & ankle':['Standing calf raise','Bent-knee calf raise','Tibialis raise','Banded ankle eversion','Single-leg balance','Lateral step-down']
};
db.exerciseBank??=[];let exerciseDraft=[];
function strengthCategory(n){return n!=='Running'&&!n.toLowerCase().includes('climb')}
function normalizeExercise(ex){
 if(Array.isArray(ex.setDetails))return {...ex,setDetails:ex.setDetails.map(s=>({...s}))};
 const n=Math.min(30,Math.max(1,Number(ex.sets)||1)),rs=String(ex.reps||'').split(','),hs=String(ex.hold||'').split(',');
 return {...ex,setDetails:Array.from({length:n},(_,i)=>({reps:rs[i]?.trim()||rs[0]?.trim()||'',weight:ex.weight||'',hold:hs[i]?.trim()||hs[0]?.trim()||''}))};
}
function exerciseEditor(){
 return '<div class="entry"><h3>Exercises & individual sets</h3><p class="sub">Log reps, weight, or hold time for each set. Add or remove sets freely.</p>'+
 '<div class="formgrid"><div class="field"><label>Exercise bank</label><select id="exercise-choice"><option value="">Choose exercise</option>'+Object.entries(EXERCISE_BANK).map(([group,arr])=>'<optgroup label="'+safe(group)+'">'+arr.map(n=>'<option value="'+safe(n)+'">'+safe(n)+'</option>').join('')+'</optgroup>').join('')+'<optgroup label="My exercises">'+db.exerciseBank.map(n=>'<option value="'+safe(n)+'">'+safe(n)+'</option>').join('')+'</optgroup></select></div><div class="field"><label>Custom exercise</label><input id="custom-exercise" placeholder="Exercise name"></div></div>'+
 '<div class="actions"><button type="button" class="soft small" id="add-exercise">+ Add exercise</button><button type="button" class="soft small" id="save-exercise">Save custom to bank</button></div>'+
 '<div id="exercise-rows">'+exerciseDraft.map((raw,i)=>{let ex=normalizeExercise(raw);return '<div class="entry"><div class="row"><strong>'+safe(ex.name)+'</strong><button type="button" class="danger small" data-remove-ex="'+i+'">Remove exercise</button></div>'+
 ex.setDetails.map((s,j)=>'<div class="formgrid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:7px"><div class="field"><label>Set '+(j+1)+' reps</label><input type="number" min="0" step="1" data-ex="'+i+'" data-set="'+j+'" data-key="reps" value="'+safe(s.reps)+'"></div><div class="field"><label>Weight</label><input inputmode="decimal" data-ex="'+i+'" data-set="'+j+'" data-key="weight" placeholder="lb / kg" value="'+safe(s.weight)+'"></div><div class="field"><label>Hold (sec)</label><input inputmode="decimal" data-ex="'+i+'" data-set="'+j+'" data-key="hold" value="'+safe(s.hold)+'"></div></div>').join('')+
 '<p class="sub" id="exercise-previous-'+i+'"></p><div class="actions"><button type="button" class="soft small" data-add-set="'+i+'">+ Add set</button><button type="button" class="soft small" data-remove-set="'+i+'" '+(ex.setDetails.length<=1?'disabled':'')+'>− Remove last set</button></div>'+
 '<div class="field section"><label>Exercise notes</label><input data-ex="'+i+'" data-key="notes" value="'+safe(ex.notes||'')+'"></div></div>'}).join('')+'</div></div>';
}
function refreshExerciseRows(){const el=$('exercise-rows');if(!el)return;let temp=document.createElement('div');temp.innerHTML=exerciseEditor();el.innerHTML=temp.querySelector('#exercise-rows').innerHTML;bindExerciseRows()}
function bindExerciseRows(){
 document.querySelectorAll('[data-ex]').forEach(el=>el.oninput=()=>{let i=Number(el.dataset.ex),j=el.dataset.set;if(j!==undefined)exerciseDraft[i].setDetails[Number(j)][el.dataset.key]=el.value;else exerciseDraft[i][el.dataset.key]=el.value});
 document.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{exerciseDraft.splice(Number(b.dataset.removeEx),1);refreshExerciseRows()});
 document.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{let ex=exerciseDraft[Number(b.dataset.addSet)];if(ex.setDetails.length>=30)return;let prev=ex.setDetails.at(-1)||{};ex.setDetails.push({reps:'',weight:prev.weight||'',hold:''});refreshExerciseRows()});
 document.querySelectorAll('[data-remove-set]').forEach(b=>b.onclick=()=>{let ex=exerciseDraft[Number(b.dataset.removeSet)];if(ex.setDetails.length>1)ex.setDetails.pop();refreshExerciseRows()});
}
function isLiftCategory(n){return ['Glute strength','Pull / lock-offs','Push / antagonist','Strength','Lifting','Lift'].includes(n)}
function previousLiftExercise(name){
 const normalized=name.trim().toLowerCase();
 return [...db.sessions].filter(s=>isLiftCategory(s.category)&&Array.isArray(s.exerciseSets)&&s.id!==edit?.id&&s.date<=date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.exerciseSets.map(ex=>({ex,date:s.date}))).find(v=>v.ex.name?.trim().toLowerCase()===normalized)||null;
}
function bindExerciseEditor(){
 if(!$('add-exercise'))return;
 bindExerciseRows();
 $('add-exercise').onclick=()=>{let name=$('custom-exercise').value.trim()||$('exercise-choice').value;if(!name)return alert('Choose or type an exercise.');let prior=isLiftCategory($('session-category')?.value)&&!edit?.id?previousLiftExercise(name):null;let entry=prior?normalizeExercise(prior.ex):{name,setDetails:[{reps:'',weight:'',hold:''}],notes:''};exerciseDraft.push({...entry,name,notes:''});$('custom-exercise').value='';refreshExerciseRows();if(prior){let info=$('exercise-previous-'+(exerciseDraft.length-1));if(info)info.textContent='Prefilled from '+prior.date+' · edit any set before saving.'}};
 $('save-exercise').onclick=()=>{let name=$('custom-exercise').value.trim();if(!name)return alert('Type an exercise name first.');if(!Object.values(EXERCISE_BANK).flat().some(x=>x.toLowerCase()===name.toLowerCase())&&!db.exerciseBank.some(x=>x.toLowerCase()===name.toLowerCase())){db.exerciseBank.push(name);persist()}alert('Added to your exercise bank.');};
}
function journal(){
 let day=db.logs[date]||{},sessions=db.sessions.filter(s=>s.date===date),sym=db.symptoms.filter(s=>s.date===date);
 let categories=[...db.targets.map(t=>t.name),'Running'].filter((x,i,a)=>a.indexOf(x)===i);
 let chosen=edit?.category||'Indoor climbing';
 let detail=chosen==='Running'?'<div class="formgrid">'+field('distance','Distance (miles)',edit?.distance||'','number')+field('runType','Run type (Easy run / Long run / Run-walk)',edit?.runType||'Easy run')+'</div><div class="formgrid">'+field('pain','Knee / ankle symptoms (0–10)',edit?.pain||'','number')+field('runSlot','Plan slot (optional: easy1 / easy2 / long)',edit?.runSlot||'')+'</div>':
 chosen.toLowerCase().includes('climb')?'<div class="formgrid">'+field('climbType','Indoor / outdoor / board',edit?.climbType||'')+field('grade','Grade / hardest send',edit?.grade||'')+field('attempts','Attempts',edit?.attempts||'','number')+field('sends','Sends',edit?.sends||'','number')+field('location','Gym / crag',edit?.location||'')+'</div>':
 chosen==='Injury Rehab & Prevention'?'<div class="formgrid">'+field('part','Body part',edit?.part||'')+field('pain','Pain (0–10)',edit?.pain||'','number')+'</div>'+exerciseEditor():exerciseEditor();
 return '<div class="field" style="max-width:230px"><label>Date</label><input id="day" type="date" value="'+safe(date)+'"></div>'+
 '<section class="card"><h2>Today’s activities</h2><p class="sub">Log as many activities as you like on the same day.</p><div class="actions"><button class="soft small" data-activity="Running">+ Run</button><button class="soft small" data-activity="Indoor climbing">+ Climb</button><button class="soft small" data-activity="Glute strength">+ Lift</button><button class="soft small" data-activity="Injury Rehab & Prevention">+ Rehab</button><button class="soft small" id="rest-day">'+(day.rest?'✓ Rest day':'Mark rest day')+'</button></div></section>'+
 '<div class="grid"><div><section class="card"><h2>Daily check-in</h2><form id="daily"><div class="formgrid">'+['sleep','energy','soreness','stress'].map(k=>'<div class="field"><label>'+k[0].toUpperCase()+k.slice(1)+' (1–10)</label><select name="'+k+'">'+options(day[k])+'</select></div>').join('')+'</div><div class="field"><label>Notes</label><textarea name="notes">'+safe(day.notes)+'</textarea></div><button class="soft">Save check-in</button></form></section>'+
 '<section class="card"><div class="row"><h2>Sessions</h2><span class="pill">'+sessions.length+'</span></div>'+sessions.map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.category)+'</strong><div class="actions"><button class="soft small" data-edit="'+safe(s.id)+'">Edit</button><button class="danger small" data-delete="sessions" data-id="'+safe(s.id)+'">Delete</button></div></div><p>RPE '+safe(s.rpe)+(s.distance?' · '+safe(s.distance)+' mi':'')+(s.duration?' · '+safe(s.duration)+' min':'')+(s.grade?' · '+safe(s.grade):'')+(s.exerciseSets?.length?' · '+s.exerciseSets.length+' exercises':s.exercises?' · '+safe(s.exercises):'')+'</p></div>').join('')+'<button class="primary section" id="new-session">+ Log session</button></section></div>'+
 '<div><section class="card"><h2 id="session-title">'+(edit?'Edit session':'Log a session')+'</h2><form id="session"><div class="field"><label>Activity</label><select name="category" id="session-category">'+categories.map(n=>'<option '+(chosen===n?'selected':'')+'>'+safe(n)+'</option>').join('')+'</select></div><div class="formgrid">'+field('duration','Duration (minutes)',edit?.duration||'','number')+'<div class="field"><label>RPE (required, 1–10)</label><select name="rpe" required>'+options(edit?.rpe)+'</select></div></div><div id="session-detail">'+detail+'</div><div class="field"><label>Notes</label><textarea name="notes">'+safe(edit?.notes)+'</textarea></div><div class="actions"><button class="primary">'+(edit?'Save changes':'Save session')+'</button>'+(edit?'<button type="button" class="soft" id="cancel-edit">Cancel</button>':'')+'</div></form></section>'+
 '<section class="card"><h2>Injury notes</h2><form id="symptom">'+field('part','Body part (e.g. left wrist)')+'<div class="formgrid"><div class="field"><label>Pain (0–10)</label><select name="pain" required>'+options('',true)+'</select></div>'+field('trigger','Trigger / activity')+'</div><div class="field"><label>Recovery / rehab notes</label><textarea name="response"></textarea></div><button class="soft">Save injury note</button></form>'+sym.map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.part)+' · '+safe(s.pain)+'/10</strong><button class="danger small" data-delete="symptoms" data-id="'+safe(s.id)+'">Delete</button></div><p>'+safe(s.trigger)+' '+safe(s.response)+'</p></div>').join('')+'</section></div></div>';
}
function progress(){let all=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="grid"><section class="card"><h2>Session history</h2><div class="sub">'+all.length+' sessions logged</div>'+all.slice(0,40).map(s=>'<div class="entry"><strong>'+safe(s.category)+'</strong><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+(s.grade?' · '+safe(s.grade):'')+'</p></div>').join('')+'</section><section class="card"><h2>Personal records</h2><form id="record">'+field('name','Exercise / metric')+field('value','Value')+field('conditions','Conditions / notes')+'<button class="primary">Add record</button></form>'+db.records.map(r=>'<div class="entry"><div class="row"><strong>'+safe(r.name)+': '+safe(r.value)+'</strong><button class="danger small" data-delete="records" data-id="'+safe(r.id)+'">Delete</button></div><p>'+safe(r.date)+' · '+safe(r.conditions)+'</p></div>').join('')+'</section></div>'}

const RUNKEY='tendo_running_v1';
const BACKUPKEY='tendo_last_backup';
let runPlan;try{runPlan=JSON.parse(localStorage.getItem(RUNKEY))}catch{}
if(!runPlan||!Array.isArray(runPlan.weeks))runPlan={start:iso(),race:'2027-03-20',week:0,weeks:[2,2.5,3,2.5,3.5,4,5,4,5.5,6.5,7,5.5,8,9,10,7,6,13.1],adjustments:[],checks:{}};
const runSave=()=>{try{localStorage.setItem(RUNKEY,JSON.stringify(runPlan))}catch{alert('Running plan could not be saved.')}};
const runSessions=()=>db.sessions.filter(s=>s.category==='Running').sort((a,b)=>a.date.localeCompare(b.date));
const recentRun=()=>runSessions().slice(-8).reverse();
function running(){
 const i=Math.min(17,Math.max(0,runPlan.week)),long=Number(runPlan.weeks[i]),race=i===17;
 const easy1=Math.max(1,Math.round(Math.min(4,long*.5)*2)/2),easy2=Math.max(1,Math.round(Math.min(5,long*.65)*2)/2);
 const slots=[{id:'easy1',title:'Easy run',lo:Math.max(1,easy1-.5),hi:easy1,desc:'Conversational pace · RPE 3–4'},{id:'easy2',title:'Easy / run-walk',lo:Math.max(1,easy2-.5),hi:easy2,desc:'Relaxed pace · walking breaks welcome'},{id:'long',title:race?'Race day':'Long run',lo:race?13.1:Math.max(1,Math.round((long-.5)*10)/10),hi:long,desc:'Comfortable effort · no speed target'}];
 let start=new Date(iso()+'T12:00:00');start.setDate(start.getDate()-(start.getDay()+6)%7);let end=new Date(start);end.setDate(end.getDate()+7);
 const weekRuns=runSessions().filter(s=>{let d=new Date(s.date+'T12:00:00');return d>=start&&d<end});
 const used=new Set(),matches=slots.map(slot=>{let m=weekRuns.find(s=>!used.has(s.id)&&s.runSlot===slot.id);if(!m){m=weekRuns.find(s=>!used.has(s.id)&&(slot.id==='long'?s.runType==='Long run':s.runType!=='Long run'))}if(m)used.add(m.id);return m});
 const complete=matches.filter(Boolean).length;
 const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 const totalLo=slots.reduce((a,s)=>a+s.lo,0),totalHi=slots.reduce((a,s)=>a+s.hi,0);
 return '<section class="card"><div class="row wrap"><div><h2>Half-marathon training</h2><p class="sub">This week · '+fmt(start)+'–'+fmt(new Date(end.getTime()-86400000))+'</p><p class="sub">Training progression: step '+(i+1)+' of 18 (manually selected)</p></div><span class="pill">'+complete+' of 3 runs</span></div><p class="muted">Suggested weekly mileage: '+totalLo.toFixed(1)+'–'+totalHi.toFixed(1)+' mi. These are flexible ranges, not quotas.</p>'+
 slots.map((s,j)=>'<div class="entry"><div class="row wrap"><div><strong>'+(matches[j]?'✓ ':'○ ')+s.title+'</strong><p class="sub">'+s.lo+'–'+s.hi+' miles · '+s.desc+'</p>'+(matches[j]?'<p class="muted">Logged '+safe(matches[j].distance)+' mi · '+safe(matches[j].date)+'</p>':'')+'</div><button class="soft small" data-run-slot="'+s.id+'">'+(matches[j]?'Log another':'Log run')+'</button></div></div>').join('')+
 '<div class="entry"><strong>Optional bonus</strong><p class="sub">Walk, mobility, or easy cycling. A fourth easy run is optional only after several consistent weeks of comfortable recovery; it does not increase your required mileage.</p></div>'+
 '<div class="actions section"><button class="soft small" id="run-back" '+(i===0?'disabled':'')+'>← Easier step</button><button class="soft small" id="run-next" '+(i===17?'disabled':'')+'>Next step →</button><button class="soft small" id="run-adjust">Adjust long run</button></div><p class="sub">Training steps advance manually, independently of the calendar. Each Monday starts a new weekly checklist. No catch-up miles.</p></section>'+
 '<section class="card"><h2>Plan settings</h2><div class="formgrid">'+field('runStart','Training start',runPlan.start,'date')+field('raceDate','Race date',runPlan.race,'date')+'</div><button class="soft small" id="save-run-dates">Save dates</button><div class="actions section"><button class="soft small" id="run-missed">I missed a week</button><button class="soft small" id="run-easier">Reduce this week</button></div></section>'+
 '<section class="card"><h2>Log a run</h2><form id="run-form"><input type="hidden" name="runSlot" value=""><div class="formgrid">'+field('date','Date',iso(),'date')+'<div class="field"><label>Run type</label><select name="runType"><option>Easy run</option><option>Long run</option><option>Run/walk</option></select></div>'+field('distance','Actual miles','','number')+field('duration','Minutes','','number')+'<div class="field"><label>RPE (required)</label><select name="rpe" required>'+options('')+'</select></div><div class="field"><label>Knee / ankle symptoms</label><select name="pain"><option value="0">None</option><option value="1">Mild</option><option value="2">Moderate</option><option value="3">Severe</option></select></div></div><div class="field"><label>Notes / changes from plan</label><textarea name="notes"></textarea></div><button class="primary">Save run</button></form></section>'+
 '<section class="card"><h2>Recent runs</h2>'+(recentRun().length?recentRun().map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.runType||'Run')+' · '+safe(s.distance||'?')+' mi</strong><button class="danger small" data-run-delete="'+safe(s.id)+'">Delete</button></div><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+(s.notes?' · '+safe(s.notes):'')+'</p></div>').join(''):'<p class="muted">No runs logged yet.</p>')+'</section>';
}
function bindRunning(){
 if(!$('run-form'))return;
 $('save-run-dates').onclick=()=>{let start=document.querySelector('[name=runStart]').value,race=document.querySelector('[name=raceDate]').value;if(!start||!race)return;runPlan.start=start;runPlan.race=race;runSave();render()};
 $('run-back').onclick=()=>{runPlan.week=Math.max(0,runPlan.week-1);runSave();render()};
 $('run-next').onclick=()=>{runPlan.week=Math.min(17,runPlan.week+1);runSave();render()};
 $('run-adjust').onclick=()=>{let i=runPlan.week,n=prompt('New long-run target in miles',runPlan.weeks[i]);if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<=0||n>13.1)return alert('Enter 0.1–13.1 miles');runPlan.weeks[i]=n;runSave();render()};
 $('run-missed').onclick=()=>{if(confirm('Move back one training week?')){runPlan.week=Math.max(0,runPlan.week-1);runSave();render()}};
 $('run-easier').onclick=()=>{let i=runPlan.week;runPlan.weeks[i]=Math.max(1,Math.round(runPlan.weeks[i]*.8*10)/10);runSave();render()};
 document.querySelectorAll('[data-run-slot]').forEach(b=>b.onclick=()=>{let slot=b.dataset.runSlot;let form=$('run-form');form.elements.runSlot.value=slot;form.elements.runType.value=slot==='long'?'Long run':'Easy run';form.scrollIntoView({behavior:'smooth',block:'start'})});
 $('run-form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!x.rpe||!x.distance||Number(x.distance)<=0)return alert('Distance and RPE are required.');db.sessions.push({...x,category:'Running',id:uid()});persist();render()};
 document.querySelectorAll('[data-run-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this run?'))return;db.sessions=db.sessions.filter(s=>s.id!==b.dataset.runDelete);persist();render()});
}
function settings(){return '<section class="card"><h2>Data & backups</h2><p class="muted">All training data stays in this browser. There is no account or cloud sync. Back up before clearing browser data or switching phones.</p><div class="notice" id="backup-status">Last backup prepared: '+safe(localStorage.getItem(BACKUPKEY)||'Never')+'. Save the JSON file to Files → iCloud Drive. Back up at least weekly and after important changes.</div><div class="actions section"><button class="primary" id="export">Backup everything to Files</button><button class="soft" id="csv">Export sessions CSV</button></div><div class="field section"><label>Restore from JSON backup (replaces current data)</label><input type="file" id="restore" accept=".json,application/json"></div></section><section class="card"><h2>About</h2><p>tendo is a private-by-default training journal. The website code is public; entries are not uploaded to the GitHub repository.</p></section>'}
function download(name,content,type){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function backup(){
 let content,name;
 try{content=JSON.stringify({format:'tendo-full-backup',version:2,createdAt:new Date().toISOString(),training:db,running:runPlan},null,2);name='tendo-backup-'+iso()+'.json';JSON.parse(content)}
 catch(e){alert('Could not prepare your backup. Your data has not been changed.');return}
 const blob=new Blob([content],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 let shared=false;
 if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'tendo backup'});shared=true}catch(e){if(e.name==='AbortError')return}
 }
 if(!shared){download(name,content,'application/json');alert('Backup download started. On iPhone, check Safari Downloads or the Files app, then move the JSON file into iCloud Drive.')}
 try{localStorage.setItem(BACKUPKEY,new Date().toLocaleString())}catch{}
 const status=$('backup-status');if(status)status.textContent='Backup prepared '+(localStorage.getItem(BACKUPKEY)||'just now')+'. Confirm the JSON file is saved in Files / iCloud Drive.';
}
function openLog(cat='',w=null){page='Journal';edit=null;exerciseDraft=[];if(w!==null){let d=new Date(db.start+'T12:00:00');d.setDate(d.getDate()+7*w);date=w===weekOf(iso())?iso():d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}else date=iso();render();if(cat)$('session').elements.category.value=cat;$('session-title').scrollIntoView({block:'start',behavior:'smooth'})}
function bind(){bindRunning();bindExerciseEditor();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;edit=null;render();scrollTo(0,0)});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{week=+b.dataset.week;render()});document.querySelectorAll('[data-logcat]').forEach(b=>b.onclick=()=>openLog(b.dataset.logcat,+b.dataset.logweek));document.querySelectorAll('[data-target]').forEach(b=>b.onchange=()=>{let g=db.targets[+b.dataset.target].weeks[week];g[b.dataset.kind]=Math.max(0,Math.min(30,Number(b.value)||0));g.more=Math.max(g.min,g.more);g.bonus=Math.max(g.more,g.bonus);persist();render()});if($('change-block'))$('change-block').onclick=()=>{let n=prompt('Block name',db.block);if(n===null)return;let s=prompt('Week 1 start date (YYYY-MM-DD)',db.start);if(s===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(Date.parse(s)))return alert('Enter a valid date.');db.block=n.trim()||'Training block';db.start=s;persist();render()};if($('add-category'))$('add-category').onclick=()=>{let n=prompt('Category name');if(!n?.trim())return;db.targets.push({id:uid(),name:n.trim(),weeks:Array.from({length:5},()=>({min:1,more:2,bonus:3}))});persist();render()};if($('rest-day'))$('rest-day').onclick=()=>{let d=db.logs[date]||{};d.rest=!d.rest;db.logs[date]=d;persist();render()};document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{edit={category:b.dataset.activity};exerciseDraft=[];render();$('session-title').scrollIntoView({behavior:'smooth'})});if($('day'))$('day').onchange=e=>{date=e.target.value||iso();edit=null;render()};if($('daily'))$('daily').onsubmit=e=>{e.preventDefault();db.logs[date]={...(db.logs[date]||{}),...Object.fromEntries(new FormData(e.target)),date};persist();render()};if($('session'))$('session').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(strengthCategory(x.category))x.exerciseSets=exerciseDraft.map(v=>({...v,setDetails:v.setDetails.map(s=>({...s}))}));if(!x.rpe||Number(x.rpe)<1||Number(x.rpe)>10)return alert('RPE 1–10 is required.');if(x.category==='Running'&&(!Number.isFinite(Number(x.distance))||Number(x.distance)<=0))return alert('Enter run distance in miles.');if(x.category==='Running'&&!(Number(x.distance)>0))return alert('Enter a run distance.');if(edit?.id){let old=db.sessions.find(s=>s.id===edit.id);if(old)Object.assign(old,x)}else db.sessions.push({...x,id:uid(),date});edit=null;exerciseDraft=[];persist();render()};if($('new-session'))$('new-session').onclick=()=>{edit=null;exerciseDraft=[];render();$('session-title').scrollIntoView({behavior:'smooth'})};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=db.sessions.find(s=>s.id===b.dataset.edit);exerciseDraft=(edit?.exerciseSets||[]).map(normalizeExercise);render();$('session-title').scrollIntoView({behavior:'smooth'})});if($('cancel-edit'))$('cancel-edit').onclick=()=>{edit=null;exerciseDraft=[];render()};if($('symptom'))$('symptom').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(x.pain==='')return alert('Select pain level');db.symptoms.push({...x,date,id:uid()});persist();render()};if($('record'))$('record').onsubmit=e=>{e.preventDefault();db.records.push({...Object.fromEntries(new FormData(e.target)),date:iso(),id:uid()});persist();render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this entry?'))return;db[b.dataset.delete]=db[b.dataset.delete].filter(x=>x.id!==b.dataset.id);persist();render()});if($('export'))$('export').onclick=()=>{backup().catch(()=>alert('Backup failed. Please try again.'))};if($('csv'))$('csv').onclick=()=>{let keys=['date','category','runType','distance','duration','rpe','grade','attempts','location','notes'];download('tendo-sessions-'+iso()+'.csv',[keys.join(','),...db.sessions.map(s=>keys.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')};if($('restore'))$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text()),t=v.format==='tendo-full-backup'?v.training:v;if(!Array.isArray(t.sessions)||!Array.isArray(t.targets)||!t.logs||!Array.isArray(t.symptoms)||!Array.isArray(t.records))throw Error();if(!confirm('Replace all local tendo data? Export a backup first.'))return;db=t;if(v.format==='tendo-full-backup'&&v.running&&Array.isArray(v.running.weeks)){runPlan=v.running;runSave()}persist();render()}catch{alert('This is not a valid tendo backup.')}}}
$('quick').onclick=()=>openLog();persist();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
