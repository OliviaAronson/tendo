<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ec"><meta name="description" content="Tendo climbing, strength and recovery journal"><title>Tendo · Training journal</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173c32;background:#f6f3ec;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f2739b;outline-offset:2px}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100dvh}.side{padding:30px 17px;background:#e6eee4;border-right:1px solid #d5dfd4}.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-1px;margin:0 8px 34px}.brand img{width:42px;height:42px;border-radius:13px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#31584b;text-align:left;padding:12px 14px;border-radius:12px;font-weight:650}.nav button.active{background:#173c32;color:white}main{max-width:1050px;width:100%;margin:auto;padding:38px 38px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}h1{font-size:clamp(27px,4vw,39px);letter-spacing:-1.5px;margin:0}h2{font-size:19px;letter-spacing:-.5px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.sub{color:#6c8178;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:#fffefa;border:1px solid #e3e6df;border-radius:18px;padding:23px;margin-bottom:17px;box-shadow:0 4px 18px #173c3208}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.primary{background:#f56f9a;border:1px solid #f56f9a;color:#153b30;font-weight:750;border-radius:11px;padding:11px 15px}.soft{background:#edf2eb;border:1px solid #dce6d9;color:#173c32;border-radius:10px;padding:9px 12px;font-weight:650}.small{font-size:12px;padding:6px 9px}.danger{background:none;color:#a43852;border:0;padding:6px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid #dce4d8;background:#f2f5f0;padding:9px 13px;border-radius:9px}.tabs button.active{background:#173c32;color:white}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0eb;gap:10px}.stat:last-child{border-bottom:0}.muted{color:#70847a}.pill{background:#e4f0d7;border-radius:30px;padding:4px 10px;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;margin-bottom:13px;min-width:0}label{font-size:12px;font-weight:700;color:#3d6356}input,select,textarea{width:100%;border:1px solid #d6ded4;border-radius:10px;padding:10px;background:white;color:#173c32;min-width:0}textarea{min-height:78px;resize:vertical}.entry{padding:13px 0;border-bottom:1px solid #e9eee7}.entry:last-child{border-bottom:0}.entry p{margin:6px 0;color:#60776a;font-size:13px;white-space:pre-wrap}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:530px}th,td{text-align:center;border-bottom:1px solid #edf0eb;padding:12px 6px}th:first-child,td:first-child{text-align:left}td button{min-width:53px}.met{background:#dcefc9}.notice{background:#f6f0de;border-radius:12px;padding:13px;color:#6b6243;font-size:13px}.bottom{display:none}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:20px}.logo-sm{width:24px;vertical-align:middle}@media(max-width:720px){.shell{display:block}.side{display:none}main{padding:25px 15px 95px}.grid{grid-template-columns:1fr}.card{padding:17px;border-radius:15px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#e6eee4;border-top:1px solid #d5dfd4;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:transparent;font-size:12px;color:#31584b;padding:8px 5px;border-radius:8px}.bottom button.active{background:#173c32;color:white}.formgrid{grid-template-columns:1fr 1fr}header .sub{display:none}header{align-items:flex-start}.mobile-title{display:block}}@media(min-width:721px){.mobile-title{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="icon.svg" alt="">Tendo</div><nav id="side-nav" class="nav"></nav></aside><main><header><div><div class="mobile-title"><img class="logo-sm" src="icon.svg" alt=""> <strong>Tendo</strong></div><h1 id="heading">Your week</h1><div class="sub">Climbing · strength · recovery</div></div><button id="quick" class="primary">+ Log</button></header><div id="app"></div></main></div><nav id="bottom-nav" class="bottom"></nav><script>
(()=>{'use strict';
const KEY='tendo_v1', names=['Outdoor climbing','Indoor climbing','Glute strength','Pull / lock-offs','Push / antagonist','Mobility','Recovery'], nav=['Home','Plan','Running','Journal','Progress','Settings'];
const iso=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const initial=()=>({version:1,start:iso(),block:'Training block',targets:names.map((name,i)=>({id:uid(),name,weeks:Array.from({length:5},()=>({min:[1,0,1,1,1,2,2][i],more:[3,5,2,2,2,3,4][i],bonus:[5,7,3,3,3,4,5][i]}))})),sessions:[],logs:{},symptoms:[],records:[],templates:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.sessions)||!Array.isArray(db.targets))db=initial();
db.logs??={};db.symptoms??=[];db.records??=[];db.templates??=[];db.targets=db.targets.filter(t=>t.name!=='Conditioning');db.targets.forEach(t=>{if(t.name==='Rehab')t.name='Recovery';if(!Array.isArray(t.weeks))t.weeks=Array.from({length:5},()=>({min:1,more:2,bonus:3}))});db.sessions.forEach(s=>{if(s.category==='Rehab')s.category='Recovery'});
let page='Home',week=0,date=iso(),edit=null;const $=id=>document.getElementById(id),persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Could not save. Export a backup and free device storage.')}},count=(name,w)=>db.sessions.filter(s=>s.category===name&&weekOf(s.date)===w).length;
function weekOf(d){return Math.floor((new Date(d+'T12:00:00')-new Date(db.start+'T12:00:00'))/604800000)}
function options(v,zero=false){return '<option value="">—</option>'+Array.from({length:zero?11:10},(_,i)=>{let n=i+(zero?0:1);return '<option '+(String(v)===String(n)?'selected':'')+'>'+n+'</option>'}).join('')}
const field=(name,label,value='',type='text')=>'<div class="field"><label>'+safe(label)+'</label><input name="'+name+'" type="'+type+'" value="'+safe(value)+'"></div>';
function navRender(){for(const id of ['side-nav','bottom-nav'])$(id).innerHTML=nav.map(n=>'<button data-page="'+n+'" class="'+(n===page?'active':'')+'">'+n+'</button>').join('')}
function render(){navRender();$('heading').textContent=({Home:'Your week',Plan:'Five-week plan',Running:'Half-marathon training',Journal:'Daily journal',Progress:'Progress',Settings:'Settings'})[page];$('app').innerHTML=({Home:home,Plan:plan,Running:running,Journal:journal,Progress:progress,Settings:settings})[page]();bind()}
function tabs(){return '<div class="tabs">'+Array.from({length:5},(_,i)=>'<button data-week="'+i+'" class="'+(week===i?'active':'')+'">Week '+(i+1)+'</button>').join('')+'</div>'}
function home(){let w=Math.min(4,Math.max(0,weekOf(iso()))),recent=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return '<div class="grid"><section class="card"><div class="row"><h2>Week '+(w+1)+' at a glance</h2><button class="soft small" data-page="Plan">Plan</button></div>'+db.targets.map(t=>'<div class="stat"><span>'+safe(t.name)+'</span><strong>'+count(t.name,w)+' / '+t.weeks[w].min+'</strong></div>').join('')+'</section><section class="card"><div class="row"><h2>Recent sessions</h2><button class="soft small" data-page="Journal">Journal</button></div>'+(recent.length?recent.map(s=>'<div class="entry"><strong>'+safe(s.category)+'</strong><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+'</p></div>').join(''):'<p class="muted">No sessions logged yet.</p>')+'</section></div><div class="notice">Your entries are saved in this browser on this device. Export a backup regularly; they do not automatically sync between your Mac and iPhone.</div>'}
function plan(){return '<section class="card"><div class="row wrap"><h2>'+safe(db.block)+'</h2><button class="soft small" id="change-block">Edit block</button></div><div class="sub">Starts '+safe(db.start)+' · tap a count to log a session</div><div class="tablewrap"><table><thead><tr><th>Training</th>'+Array.from({length:5},(_,i)=>'<th>W'+(i+1)+'</th>').join('')+'</tr></thead><tbody>'+db.targets.map(t=>'<tr><td>'+safe(t.name)+'</td>'+t.weeks.map((g,i)=>'<td><button class="soft small '+(count(t.name,i)>=g.min&&g.min?'met':'')+'" data-logcat="'+safe(t.name)+'" data-logweek="'+i+'">'+count(t.name,i)+'/'+g.min+'</button></td>').join('')+'</tr>').join('')+'</tbody></table></div></section><section class="card"><h2>Weekly targets</h2>'+tabs()+'<p class="sub">Minimum / More / Bonus sessions</p>'+db.targets.map((t,i)=>'<div class="entry"><strong>'+safe(t.name)+'</strong><div class="formgrid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px">'+['min','more','bonus'].map(k=>'<div class="field"><label>'+k+'</label><input type="number" min="0" max="30" data-target="'+i+'" data-kind="'+k+'" value="'+t.weeks[week][k]+'"></div>').join('')+'</div></div>').join('')+'<button class="soft section" id="add-category">+ Category</button></section>'}
function journal(){let day=db.logs[date]||{},sessions=db.sessions.filter(s=>s.date===date),sym=db.symptoms.filter(s=>s.date===date);return '<div class="field" style="max-width:230px"><label>Date</label><input id="day" type="date" value="'+safe(date)+'"></div><div class="grid"><div><section class="card"><h2>Daily check-in</h2><form id="daily"><div class="formgrid">'+['sleep','energy','soreness','stress'].map(k=>'<div class="field"><label>'+k[0].toUpperCase()+k.slice(1)+' (1–10)</label><select name="'+k+'">'+options(day[k])+'</select></div>').join('')+'</div><div class="field"><label>Notes</label><textarea name="notes">'+safe(day.notes)+'</textarea></div><button class="soft">Save check-in</button></form></section><section class="card"><div class="row"><h2>Sessions</h2><span class="pill">'+sessions.length+'</span></div>'+sessions.map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.category)+'</strong><div class="actions"><button class="soft small" data-edit="'+safe(s.id)+'">Edit</button><button class="danger small" data-delete="sessions" data-id="'+safe(s.id)+'">Delete</button></div></div><p>RPE '+safe(s.rpe)+(s.duration?' · '+safe(s.duration)+' min':'')+(s.grade?' · '+safe(s.grade):'')+(s.notes?' · '+safe(s.notes):'')+'</p></div>').join('')+'<button class="primary section" id="new-session">+ Log session</button></section></div><div><section class="card"><h2 id="session-title">'+(edit?'Edit session':'Log a session')+'</h2><form id="session"><div class="field"><label>Category</label><select name="category">'+db.targets.map(t=>'<option '+(edit?.category===t.name?'selected':'')+'>'+safe(t.name)+'</option>').join('')+'</select></div><div class="formgrid">'+field('duration','Duration (minutes)',edit?.duration||'','number')+'<div class="field"><label>RPE (required, 1–10)</label><select name="rpe" required>'+options(edit?.rpe)+'</select></div></div><div class="formgrid">'+field('climbType','Climb type / board',edit?.climbType||'')+field('grade','Grade / best send',edit?.grade||'')+field('attempts','Attempts',edit?.attempts||'','number')+field('location','Gym / crag',edit?.location||'')+'</div><div class="field"><label>Notes</label><textarea name="notes">'+safe(edit?.notes)+'</textarea></div><div class="actions"><button class="primary">'+(edit?'Save changes':'Save session')+'</button>'+(edit?'<button type="button" class="soft" id="cancel-edit">Cancel</button>':'')+'</div></form></section><section class="card"><h2>Injury & recovery</h2><form id="symptom">'+field('part','Body part (e.g. left wrist)')+'<div class="formgrid"><div class="field"><label>Pain (0–10)</label><select name="pain" required>'+options('',true)+'</select></div>'+field('trigger','Trigger / activity')+'</div><div class="field"><label>Recovery / rehab notes</label><textarea name="response"></textarea></div><button class="soft">Save recovery entry</button></form>'+sym.map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.part)+' · '+safe(s.pain)+'/10</strong><button class="danger small" data-delete="symptoms" data-id="'+safe(s.id)+'">Delete</button></div><p>'+safe(s.trigger)+' '+safe(s.response)+'</p></div>').join('')+'</section></div></div>'}
function progress(){let all=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="grid"><section class="card"><h2>Session history</h2><div class="sub">'+all.length+' sessions logged</div>'+all.slice(0,40).map(s=>'<div class="entry"><strong>'+safe(s.category)+'</strong><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+(s.grade?' · '+safe(s.grade):'')+'</p></div>').join('')+'</section><section class="card"><h2>Personal records</h2><form id="record">'+field('name','Exercise / metric')+field('value','Value')+field('conditions','Conditions / notes')+'<button class="primary">Add record</button></form>'+db.records.map(r=>'<div class="entry"><div class="row"><strong>'+safe(r.name)+': '+safe(r.value)+'</strong><button class="danger small" data-delete="records" data-id="'+safe(r.id)+'">Delete</button></div><p>'+safe(r.date)+' · '+safe(r.conditions)+'</p></div>').join('')+'</section></div>'}

const RUNKEY='tendo_running_v1';
const BACKUPKEY='tendo_last_backup';
let runPlan;try{runPlan=JSON.parse(localStorage.getItem(RUNKEY))}catch{}
if(!runPlan||!Array.isArray(runPlan.weeks))runPlan={start:iso(),race:'2027-03-20',week:0,weeks:[2,2.5,3,2.5,3.5,4,5,4,5.5,6.5,7,5.5,8,9,10,7,6,13.1],adjustments:[],checks:{}};
const runSave=()=>{try{localStorage.setItem(RUNKEY,JSON.stringify(runPlan))}catch{alert('Running plan could not be saved.')}};
const runSessions=()=>db.sessions.filter(s=>s.category==='Running').sort((a,b)=>a.date.localeCompare(b.date));
const recentRun=()=>runSessions().slice(-8).reverse();
function running(){
 const i=Math.min(17,Math.max(0,runPlan.week)),long=Number(runPlan.weeks[i]),race=i===17;
 const easy1=Math.max(1,Math.round(Math.min(4,long*.5)*2)/2),easy2=Math.max(1,Math.round(Math.min(5,long*.65)*2)/2);
 const slots=[{id:'easy1',title:'Easy run',lo:Math.max(1,easy1-.5),hi:easy1,desc:'Conversational pace · RPE 3–4'},{id:'easy2',title:'Easy / run-walk',lo:Math.max(1,easy2-.5),hi:easy2,desc:'Relaxed pace · walking breaks welcome'},{id:'long',title:race?'Race day':'Long run',lo:race?13.1:Math.max(1,Math.round((long-.5)*10)/10),hi:long,desc:'Comfortable effort · no speed target'}];
 let start=new Date(runPlan.start+'T12:00:00');start.setDate(start.getDate()+7*i);let end=new Date(start);end.setDate(end.getDate()+7);
 const weekRuns=runSessions().filter(s=>{let d=new Date(s.date+'T12:00:00');return d>=start&&d<end});
 const used=new Set(),matches=slots.map(slot=>{let m=weekRuns.find(s=>!used.has(s.id)&&s.runSlot===slot.id);if(!m){m=weekRuns.find(s=>!used.has(s.id)&&(slot.id==='long'?s.runType==='Long run':s.runType!=='Long run'))}if(m)used.add(m.id);return m});
 const complete=matches.filter(Boolean).length;
 const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 const totalLo=slots.reduce((a,s)=>a+s.lo,0),totalHi=slots.reduce((a,s)=>a+s.hi,0);
 return '<section class="card"><div class="row wrap"><div><h2>Half-marathon training</h2><p class="sub">Week '+(i+1)+' of 18 · '+fmt(start)+'–'+fmt(new Date(end.getTime()-86400000))+'</p></div><span class="pill">'+complete+' of 3 runs</span></div><p class="muted">Suggested weekly mileage: '+totalLo.toFixed(1)+'–'+totalHi.toFixed(1)+' mi. These are flexible ranges, not quotas.</p>'+
 slots.map((s,j)=>'<div class="entry"><div class="row wrap"><div><strong>'+(matches[j]?'✓ ':'○ ')+s.title+'</strong><p class="sub">'+s.lo+'–'+s.hi+' miles · '+s.desc+'</p>'+(matches[j]?'<p class="muted">Logged '+safe(matches[j].distance)+' mi · '+safe(matches[j].date)+'</p>':'')+'</div><button class="soft small" data-run-slot="'+s.id+'">'+(matches[j]?'Log another':'Log run')+'</button></div></div>').join('')+
 '<div class="entry"><strong>Optional bonus</strong><p class="sub">Walk, mobility, or easy cycling. A fourth easy run is optional only after several consistent weeks of comfortable recovery; it does not increase your required mileage.</p></div>'+
 '<div class="actions section"><button class="soft small" id="run-back" '+(i===0?'disabled':'')+'>← Previous week</button><button class="soft small" id="run-next" '+(i===17?'disabled':'')+'>Next week →</button><button class="soft small" id="run-adjust">Adjust long run</button></div><p class="sub">Weeks advance manually. If you miss sessions, repeat this week or move back. No catch-up miles.</p></section>'+
 '<section class="card"><h2>Plan settings</h2><div class="formgrid">'+field('runStart','Training start',runPlan.start,'date')+field('raceDate','Race date',runPlan.race,'date')+'</div><button class="soft small" id="save-run-dates">Save dates</button><div class="actions section"><button class="soft small" id="run-missed">I missed a week</button><button class="soft small" id="run-easier">Reduce this week</button></div></section>'+
 '<section class="card"><h2>Log a run</h2><form id="run-form"><input type="hidden" name="runSlot" value=""><div class="formgrid">'+field('date','Date',iso(),'date')+'<div class="field"><label>Run type</label><select name="runType"><option>Easy run</option><option>Long run</option><option>Run/walk</option></select></div>'+field('distance','Actual miles','','number')+field('duration','Minutes','','number')+'<div class="field"><label>RPE (required)</label><select name="rpe" required>'+options('')+'</select></div><div class="field"><label>Knee / ankle symptoms</label><select name="pain"><option value="0">None</option><option value="1">Mild</option><option value="2">Moderate</option><option value="3">Severe</option></select></div></div><div class="field"><label>Notes / changes from plan</label><textarea name="notes"></textarea></div><button class="primary">Save run</button></form></section>'+
 '<section class="card"><h2>Recent runs</h2>'+(recentRun().length?recentRun().map(s=>'<div class="entry"><div class="row"><strong>'+safe(s.runType||'Run')+' · '+safe(s.distance||'?')+' mi</strong><button class="danger small" data-run-delete="'+safe(s.id)+'">Delete</button></div><p>'+safe(s.date)+' · RPE '+safe(s.rpe)+(s.notes?' · '+safe(s.notes):'')+'</p></div>').join(''):'<p class="muted">No runs logged yet.</p>')+'</section>';
}
function bindRunning(){
 if(!$('run-form'))return;
 $('save-run-dates').onclick=()=>{let start=document.querySelector('[name=runStart]').value,race=document.querySelector('[name=raceDate]').value;if(!start||!race)return;runPlan.start=start;runPlan.race=race;runSave();render()};
 $('run-back').onclick=()=>{runPlan.week=Math.max(0,runPlan.week-1);runSave();render()};
 $('run-next').onclick=()=>{runPlan.week=Math.min(17,runPlan.week+1);runSave();render()};
 $('run-adjust').onclick=()=>{let i=runPlan.week,n=prompt('New long-run target in miles',runPlan.weeks[i]);if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<=0||n>13.1)return alert('Enter 0.1–13.1 miles');runPlan.weeks[i]=n;runSave();render()};
 $('run-missed').onclick=()=>{if(confirm('Move back one training week?')){runPlan.week=Math.max(0,runPlan.week-1);runSave();render()}};
 $('run-easier').onclick=()=>{let i=runPlan.week;runPlan.weeks[i]=Math.max(1,Math.round(runPlan.weeks[i]*.8*10)/10);runSave();render()};
 document.querySelectorAll('[data-run-slot]').forEach(b=>b.onclick=()=>{let slot=b.dataset.runSlot;let form=$('run-form');form.elements.runSlot.value=slot;form.elements.runType.value=slot==='long'?'Long run':'Easy run';form.scrollIntoView({behavior:'smooth',block:'start'})});
 $('run-form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!x.rpe||!x.distance||Number(x.distance)<=0)return alert('Distance and RPE are required.');db.sessions.push({...x,category:'Running',id:uid()});persist();render()};
 document.querySelectorAll('[data-run-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this run?'))return;db.sessions=db.sessions.filter(s=>s.id!==b.dataset.runDelete);persist();render()});
}
function settings(){return '<section class="card"><h2>Data & backups</h2><p class="muted">All training data stays in this browser. There is no account or cloud sync. Back up before clearing browser data or switching phones.</p><div class="notice" id="backup-status">Last backup: '+safe(localStorage.getItem(BACKUPKEY)||'Never')+'. Save the downloaded JSON file to Files → iCloud Drive. Back up at least weekly and after important changes.</div><div class="actions section"><button class="primary" id="export">Backup everything to Files</button><button class="soft" id="csv">Export sessions CSV</button></div><div class="field section"><label>Restore from JSON backup (replaces current data)</label><input type="file" id="restore" accept=".json,application/json"></div></section><section class="card"><h2>About</h2><p>Tendo is a private-by-default training journal. The website code is public; entries are not uploaded to the GitHub repository.</p></section>'}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function backup(){download('tendo-backup-'+iso()+'.json',JSON.stringify({format:'tendo-full-backup',version:2,createdAt:new Date().toISOString(),training:db,running:runPlan},null,2),'application/json');try{localStorage.setItem(BACKUPKEY,new Date().toLocaleString())}catch{}render();alert('Backup file prepared. Save it to Files → iCloud Drive. A download alone is not an iCloud backup.')}
function openLog(cat='',w=null){page='Journal';edit=null;if(w!==null){let d=new Date(db.start+'T12:00:00');d.setDate(d.getDate()+7*w);date=w===weekOf(iso())?iso():d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}else date=iso();render();if(cat)$('session').elements.category.value=cat;$('session-title').scrollIntoView({block:'start',behavior:'smooth'})}
function bind(){bindRunning();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;edit=null;render();scrollTo(0,0)});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{week=+b.dataset.week;render()});document.querySelectorAll('[data-logcat]').forEach(b=>b.onclick=()=>openLog(b.dataset.logcat,+b.dataset.logweek));document.querySelectorAll('[data-target]').forEach(b=>b.onchange=()=>{let g=db.targets[+b.dataset.target].weeks[week];g[b.dataset.kind]=Math.max(0,Math.min(30,Number(b.value)||0));g.more=Math.max(g.min,g.more);g.bonus=Math.max(g.more,g.bonus);persist();render()});if($('change-block'))$('change-block').onclick=()=>{let n=prompt('Block name',db.block);if(n===null)return;let s=prompt('Week 1 start date (YYYY-MM-DD)',db.start);if(s===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(Date.parse(s)))return alert('Enter a valid date.');db.block=n.trim()||'Training block';db.start=s;persist();render()};if($('add-category'))$('add-category').onclick=()=>{let n=prompt('Category name');if(!n?.trim())return;db.targets.push({id:uid(),name:n.trim(),weeks:Array.from({length:5},()=>({min:1,more:2,bonus:3}))});persist();render()};if($('day'))$('day').onchange=e=>{date=e.target.value||iso();edit=null;render()};if($('daily'))$('daily').onsubmit=e=>{e.preventDefault();db.logs[date]={...Object.fromEntries(new FormData(e.target)),date};persist();render()};if($('session'))$('session').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!x.rpe||Number(x.rpe)<1||Number(x.rpe)>10)return alert('RPE 1–10 is required.');if(edit){let old=db.sessions.find(s=>s.id===edit.id);if(old)Object.assign(old,x)}else db.sessions.push({...x,id:uid(),date});edit=null;persist();render()};if($('new-session'))$('new-session').onclick=()=>{edit=null;render();$('session-title').scrollIntoView({behavior:'smooth'})};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=db.sessions.find(s=>s.id===b.dataset.edit);render();$('session-title').scrollIntoView({behavior:'smooth'})});if($('cancel-edit'))$('cancel-edit').onclick=()=>{edit=null;render()};if($('symptom'))$('symptom').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(x.pain==='')return alert('Select pain level');db.symptoms.push({...x,date,id:uid()});persist();render()};if($('record'))$('record').onsubmit=e=>{e.preventDefault();db.records.push({...Object.fromEntries(new FormData(e.target)),date:iso(),id:uid()});persist();render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this entry?'))return;db[b.dataset.delete]=db[b.dataset.delete].filter(x=>x.id!==b.dataset.id);persist();render()});if($('export'))$('export').onclick=backup;if($('csv'))$('csv').onclick=()=>{let keys=['date','category','runType','distance','duration','rpe','grade','attempts','location','notes'];download('tendo-sessions-'+iso()+'.csv',[keys.join(','),...db.sessions.map(s=>keys.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')};if($('restore'))$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text()),t=v.format==='tendo-full-backup'?v.training:v;if(!Array.isArray(t.sessions)||!Array.isArray(t.targets)||!t.logs||!Array.isArray(t.symptoms)||!Array.isArray(t.records))throw Error();if(!confirm('Replace all local Tendo data? Export a backup first.'))return;db=t;if(v.format==='tendo-full-backup'&&v.running&&Array.isArray(v.running.weeks)){runPlan=v.running;runSave()}persist();render()}catch{alert('This is not a valid Tendo backup.')}}}
$('quick').onclick=()=>openLog();persist();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
